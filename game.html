<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Master – Le Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="logo" href="index.html">🤖 AI Master</a>
      <a class="link" href="index.html#fiche">La fiche</a>
      <a class="link" href="game.html">Le jeu</a>
    </nav>

    <!-- Écran d'accueil -->
    <section id="start" class="center">
      <span class="mascot">🤖</span>
      <h1>Le <span>Quiz</span> de l'AI Master</h1>
      <p class="lead">10 questions tirées au hasard. 3 batteries 🔋 : chaque erreur ou chaque temps écoulé en coûte une. Enchaîne les bonnes réponses pour faire exploser ton combo !</p>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="btn-start">🚀 C'est parti</button>
      </div>
      <p class="lead" id="best"></p>
    </section>

    <!-- Jeu -->
    <section id="game" class="hidden">
      <div class="hud">
        <span class="pill" id="hud-q">Question 1/10</span>
        <span class="pill" id="hud-lives">🔋🔋🔋</span>
        <span class="pill" id="hud-combo">🔥 x0</span>
        <span class="pill" id="hud-score">⭐ 0</span>
      </div>
      <div class="timer"><div id="timer-bar"></div></div>
      <div class="qbox" id="qbox">
        <div class="qtype" id="qtype"></div>
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn hidden" id="btn-next">Suivant →</button>
      </div>
    </section>

    <!-- Fin -->
    <section id="end" class="center hidden">
      <span class="mascot" id="end-mascot">🏆</span>
      <h1 id="end-title"></h1>
      <div class="big" id="end-score"></div>
      <p class="lead" id="end-text"></p>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="btn-again">🔁 Rejouer</button>
        <a class="btn alt" href="index.html#fiche">📚 Relire la fiche</a>
      </div>
    </section>

    <footer>AI Master · quiz de révision</footer>
  </div>

<script>
// ---------- Questions (basées sur la fiche) ----------
// type: "QCM" ou "Vrai / Faux" ; a = index de la bonne réponse
const QUESTIONS = [
  { t: "QCM", q: "Un agent IA, c'est…", o: ["Un LLM en boucle : observer, raisonner, agir avec des outils", "Un LLM qui répond une seule fois", "Une base de données", "Un type de GPU"], a: 0, e: "Agent = LLM en boucle (observer, raisonner, agir) jusqu'à ce que la tâche soit terminée." },
  { t: "QCM", q: "Un texte malveillant lu par l'agent qui lui fait exécuter des ordres s'appelle…", o: ["Un bug de température", "Une prompt injection", "Une compaction", "Un embedding"], a: 1, e: "C'est la prompt injection, un des gros risques des super-agents." },
  { t: "Vrai / Faux", q: "Plus un agent a de permissions, moins il y a de risques.", o: ["Vrai", "Faux"], a: 1, e: "C'est l'inverse : plus de permissions = erreurs en cascade, actions irréversibles, fuites de données." },
  { t: "QCM", q: "MCP (Model Context Protocol) est souvent comparé à…", o: ["Un microscope", "Un USB-C pour l'IA", "Un antivirus", "Un moteur de jeu"], a: 1, e: "MCP, lancé par Anthropic fin 2024, connecte de façon uniforme les applis d'IA aux outils et aux données." },
  { t: "QCM", q: "Selon la thèse « les interfaces vont disparaître », la valeur se déplace vers…", o: ["Les boutons et les menus", "Les données, les règles métier et l'exécution", "Les écrans plus grands", "Les claviers"], a: 1, e: "L'interface (le SaaS) perd en valeur au profit des données, des règles métier et de l'exécution." },
  { t: "QCM", q: "Un token, c'est…", o: ["Un mot de passe", "Un morceau de mot, l'unité de texte du modèle", "Une pièce de monnaie", "Un fichier"], a: 1, e: "En anglais, 1 000 tokens valent environ 750 mots. Les API facturent au token." },
  { t: "Vrai / Faux", q: "Les API d'IA facturent seulement les tokens en sortie.", o: ["Vrai", "Faux"], a: 1, e: "On paie l'entrée ET la sortie, et la sortie coûte souvent plus cher par token." },
  { t: "QCM", q: "Pourquoi un agent consomme-t-il des milliards de tokens ?", o: ["Il relit son contexte à chaque étape, cherche et écrit en boucle", "Il dort beaucoup", "Il télécharge des films", "Il joue aux échecs"], a: 0, e: "Lire, chercher (scraper) et produire : la boucle relit le contexte à chaque étape." },
  { t: "QCM", q: "Quel est souvent le plus gros poste de consommation de tokens d'un agent ?", o: ["Produire la réponse finale", "Scraper et chercher de l'information", "Dire bonjour", "Compter jusqu'à 10"], a: 1, e: "Les pages lues sont longues, donc la recherche pèse lourd." },
  { t: "Vrai / Faux", q: "En général, le français consomme plus de tokens que l'anglais pour un même contenu.", o: ["Vrai", "Faux"], a: 0, e: "Cela dépend du tokenizer, mais le français est généralement plus gourmand que l'anglais." },
  { t: "QCM", q: "La fenêtre de contexte, c'est…", o: ["La fenêtre de ton navigateur", "La mémoire de travail du modèle dans une session", "Le disque dur du modèle", "Un écran de connexion"], a: 1, e: "Tout ce que le modèle peut « avoir sous les yeux » ; hors fenêtre, il ne sait rien." },
  { t: "QCM", q: "Le phénomène « lost in the middle » signifie que…", o: ["Le modèle se perd dans les menus", "Les infos au milieu du contexte sont moins bien retrouvées", "Le modèle oublie son nom", "Les tokens disparaissent"], a: 1, e: "Les modèles exploitent moins bien le milieu d'un long contexte." },
  { t: "QCM", q: "Pour limiter les coûts et la dérive d'un long contexte, on utilise…", o: ["La compaction", "La congélation", "La fragmentation", "La pixellisation"], a: 0, e: "Compaction : le modèle résume la conversation, puis on repart d'un contexte propre." },
  { t: "QCM", q: "Les LLM fonctionnent principalement en…", o: ["Prédisant le token suivant", "Dessinant des arbres de décision", "Simulant la physique", "Lançant des dés au hasard pur"], a: 0, e: "Ils prédisent le token suivant d'après des statistiques apprises sur d'énormes corpus." },
  { t: "QCM", q: "Qui défend la thèse des « World Models » ?", o: ["Yann LeCun", "Elon Musk", "Daniel Kahneman", "Linus Torvalds"], a: 0, e: "LeCun pense que les LLM ne comprennent pas vraiment le monde physique." },
  { t: "QCM", q: "Comment s'appelle l'architecture de référence de LeCun ?", o: ["JEPA", "GPT", "RAG", "CLI"], a: 0, e: "JEPA (Joint Embedding Predictive Architecture) prédit dans un espace abstrait, pas pixel par pixel." },
  { t: "QCM", q: "Le « Système 1 » de Kahneman correspond à…", o: ["Une pensée lente et réfléchie", "Une pensée rapide et automatique", "Un système d'exploitation", "Une pensée aléatoire"], a: 1, e: "Système 1 = rapide et automatique ; Système 2 = lent et réfléchi." },
  { t: "Vrai / Faux", q: "Les hallucinations se produisent parce que le modèle génère du plausible, pas forcément du vrai.", o: ["Vrai", "Faux"], a: 0, e: "On ne peut pas prédire à 100 % ses réponses, d'où le problème en finance, santé ou défense." },
  { t: "QCM", q: "Que signifie RAG ?", o: ["Random Access Game", "Retrieval-Augmented Generation", "Rapid AI Gateway", "Robot Assisted Graphics"], a: 1, e: "Génération augmentée par la recherche : on donne au LLM des documents pertinents au moment de la question." },
  { t: "QCM", q: "Dans un RAG, la première étape est de…", o: ["Transformer la question en embedding", "Entraîner un nouveau modèle", "Éteindre le GPU", "Traduire en chinois"], a: 0, e: "Question → embedding → recherche en base vectorielle → passages dans le prompt → réponse." },
  { t: "QCM", q: "Un embedding, c'est…", o: ["Un vecteur de nombres qui capture le sens d'un contenu", "Une image compressée", "Un mot de passe chiffré", "Un type de GPU"], a: 0, e: "Deux contenus de sens proche ont des vecteurs proches (mesurés par la similarité cosinus)." },
  { t: "QCM", q: "L'inférence, c'est…", o: ["L'entraînement du modèle", "L'utilisation d'un modèle déjà entraîné pour répondre", "La suppression du modèle", "Le choix du nom du modèle"], a: 1, e: "Chaque prompt déclenche de l'inférence, et c'est ce qui est facturé au token." },
  { t: "QCM", q: "Une température proche de 0 donne des réponses…", o: ["Stables et factuelles", "Très créatives", "Toujours vraies", "En majuscules"], a: 0, e: "Basse température = régularité. Mais attention : elle règle la régularité, pas la vérité." },
  { t: "Vrai / Faux", q: "À température 0, un modèle ne peut plus halluciner.", o: ["Vrai", "Faux"], a: 1, e: "Faux : à 0, il peut répéter la même erreur à l'identique." },
  { t: "QCM", q: "Un modèle « open weights », c'est un modèle dont…", o: ["Tout le code et les données sont publics", "Les poids sont publiés et téléchargeables", "L'accès est gratuit pour toujours", "Les poids sont secrets"], a: 1, e: "Souvent seuls les poids sont publiés : ce n'est pas forcément de l'open source au sens strict." },
  { t: "QCM", q: "Lequel de ces modèles est « open weights » ?", o: ["Llama (Meta)", "Un modèle fermé accessible uniquement par API", "Aucun", "Tous les modèles"], a: 0, e: "Exemples : Llama, Mistral, Qwen, DeepSeek, gpt-oss — distribués notamment sur Hugging Face." },
  { t: "QCM", q: "Quelle est la différence entre terminal et CLI ?", o: ["Le terminal est la fenêtre, la CLI est l'outil qu'on y lance", "Aucune", "La CLI est une fenêtre, le terminal un outil", "Le terminal est un jeu vidéo"], a: 0, e: "Exemple de CLI : git commit, ou claude pour lancer Claude Code." },
  { t: "QCM", q: "Pourquoi les agents adorent les CLI ?", o: ["Texte en entrée, texte en sortie : parfait pour un LLM", "Elles sont jolies", "Elles ont des boutons", "Elles sont silencieuses"], a: 0, e: "Une CLI est facile à enchaîner et à automatiser." },
  { t: "QCM", q: "L'orchestration, c'est…", o: ["Jouer de la musique", "Coordonner plusieurs étapes, outils, modèles ou agents", "Compresser un modèle", "Écrire un prompt"], a: 1, e: "Un agent « chef d'orchestre » découpe la demande, confie des sous-tâches, assemble les résultats." },
  { t: "QCM", q: "Quelle est la formule utile à retenir ?", o: ["Agent = modèle + harness", "Agent = token + GPU", "Agent = prompt seul", "Agent = interface + bouton"], a: 0, e: "Claude Code, Codex CLI ou OpenClaw sont des harness : boucle, outils, permissions, gestion du contexte." },
  { t: "Vrai / Faux", q: "À modèle égal, un meilleur harness donne de bien meilleurs résultats.", o: ["Vrai", "Faux"], a: 0, e: "Le harness donne au modèle les moyens d'agir et pose les garde-fous." },
  { t: "QCM", q: "Quelle parade réduit les hallucinations en retrouvant des sources fiables avant de répondre ?", o: ["Le RAG", "La température à 2", "Le terminal", "Le tokenizer"], a: 0, e: "RAG, appel d'outils, vérification humaine et petits modèles spécialisés sont les parades citées." }
];

const ROUND = 10, LIVES = 3, TIME = 20; // secondes par question
const MASCOTS = ["🤖", "🦾", "🧠", "👾"];
const WIN = ["Bien joué !", "Boom !", "Cerveau activé 🧠", "Tu gères !", "Propre !", "Le GPU est fier de toi"];
const LOSE = ["Aïe, hallucination détectée 🫠", "Raté, c'était du plausible mais pas du vrai", "Le modèle a bugué…", "Context rot 😵", "Retourne voir la fiche !"];
const $ = id => document.getElementById(id);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

let current, deck, idx, lives, score, combo, bestCombo, correct, timerId, deadline, locked;

function show(id) { ["start", "game", "end"].forEach(s => $(s).classList.toggle("hidden", s !== id)); }
function bestScore() { try { return Number(localStorage.getItem("aimaster-best")) || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem("aimaster-best", String(v)); } catch (e) {} }
function renderBest() { const b = bestScore(); $("best").textContent = b ? "Ton record : ⭐ " + b : ""; }

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function start() {
  deck = shuffle(QUESTIONS).slice(0, ROUND);
  idx = 0; lives = LIVES; score = 0; combo = 0; bestCombo = 0; correct = 0;
  show("game");
  nextQuestion();
}

function hud() {
  $("hud-q").textContent = "Question " + (idx + 1) + "/" + ROUND;
  $("hud-lives").textContent = "🔋".repeat(lives) + "🪫".repeat(LIVES - lives);
  $("hud-combo").textContent = "🔥 x" + combo;
  $("hud-score").textContent = "⭐ " + score;
}

function nextQuestion() {
  const item = deck[idx];
  locked = false;
  hud();
  $("qtype").textContent = item.t;
  $("question").textContent = item.q;
  $("feedback").className = "feedback";
  $("btn-next").classList.add("hidden");
  const box = $("answers");
  box.innerHTML = "";
  const order = item.t === "QCM" ? shuffle(item.o.map((_, k) => k)) : item.o.map((_, k) => k);
  current = { order, correctPos: order.indexOf(item.a) };
  order.forEach((orig, i) => {
    const b = document.createElement("button");
    b.textContent = item.o[orig];
    b.addEventListener("click", () => answer(i));
    box.appendChild(b);
  });
  startTimer();
}

function startTimer() {
  clearInterval(timerId);
  deadline = Date.now() + TIME * 1000;
  timerId = setInterval(() => {
    const left = Math.max(0, deadline - Date.now());
    $("timer-bar").style.transform = "scaleX(" + (left / (TIME * 1000)) + ")";
    if (left === 0) answer(-1);
  }, 50);
}

function answer(i) {
  if (locked) return;
  locked = true;
  clearInterval(timerId);
  const item = deck[idx];
  const left = Math.max(0, deadline - Date.now());
  const ok = i === current.correctPos;
  const buttons = $("answers").children;
  for (let k = 0; k < buttons.length; k++) {
    buttons[k].disabled = true;
    if (k === current.correctPos) buttons[k].classList.add("good");
  }
  const fb = $("feedback");
  if (ok) {
    combo++; bestCombo = Math.max(bestCombo, combo); correct++;
    const gain = 100 + Math.round(left / 1000) * 5 + (combo - 1) * 20;
    score += gain;
    fb.innerHTML = "<b class='good'>" + pick(WIN) + " +" + gain + "</b><br>";
    $("qbox").classList.remove("shake"); void $("qbox").offsetWidth; $("qbox").classList.add("pop");
  } else {
    if (i >= 0) buttons[i].classList.add("bad");
    combo = 0; lives--;
    fb.innerHTML = "<b class='bad'>" + (i < 0 ? "Temps écoulé ⏰" : pick(LOSE)) + "</b><br>";
    $("qbox").classList.remove("pop"); void $("qbox").offsetWidth; $("qbox").classList.add("shake");
  }
  fb.appendChild(document.createTextNode(item.e));
  fb.classList.add("show");
  hud();
  const last = idx === ROUND - 1 || lives === 0;
  const nb = $("btn-next");
  nb.textContent = last ? "Voir mon résultat 🏁" : "Suivant →";
  nb.classList.remove("hidden");
}

function next() {
  if (lives === 0 || idx === ROUND - 1) return finish();
  idx++;
  nextQuestion();
}

function rank(pct, dead) {
  if (dead) return ["🪫", "Plus de batterie !"];
  if (pct === 100) return ["🏆", "AI Master légendaire"];
  if (pct >= 80) return ["🦾", "Agent autonome"];
  if (pct >= 50) return ["🧠", "LLM en progression"];
  return ["👾", "Petit modèle en cours d'entraînement"];
}

function finish() {
  clearInterval(timerId);
  const played = lives === 0 ? idx + 1 : ROUND;
  const pct = Math.round(correct / ROUND * 100);
  const [m, title] = rank(pct, lives === 0);
  $("end-mascot").textContent = m;
  $("end-title").textContent = title;
  $("end-score").textContent = "⭐ " + score;
  const prev = bestScore();
  let txt = correct + " bonne" + (correct > 1 ? "s" : "") + " réponse" + (correct > 1 ? "s" : "") + " sur " + played + " · meilleur combo 🔥 x" + bestCombo + ".";
  if (score > prev) { saveBest(score); txt += " Nouveau record ! 🎉"; }
  $("end-text").textContent = txt;
  renderBest();
  show("end");
}

$("btn-start").addEventListener("click", start);
$("btn-again").addEventListener("click", start);
$("btn-next").addEventListener("click", next);
document.addEventListener("keydown", e => {
  if ($("game").classList.contains("hidden")) return;
  if (e.key === "Enter" && !$("btn-next").classList.contains("hidden")) next();
  const n = Number(e.key);
  if (n >= 1 && n <= 4 && !locked && n <= deck[idx].o.length) answer(n - 1);
});
renderBest();
document.querySelector("#start .mascot").textContent = pick(MASCOTS);
</script>
</body>
</html>
